# @hsinsekai-nanami/dsh-usage — DSH bundle patch.
# Host half: 统一 Token 消耗体系 API（前缀 /api/dsh-usage/）：
#   GET     /api/dsh-usage/session?sessionId=<id>        单会话逐模型归集（实时费用徽标）
#   GET     /api/dsh-usage/summary?range=1d|7d|30d|all   全局用量汇总（设置页看板）
#   GET     /api/dsh-usage/pricing                       计价目录（含用户覆盖）
#   GET     /api/dsh-usage/quota?provider=<id>[&refresh] 单 provider 订阅额度
#   GET     /api/dsh-usage/quota/all                     全部 Coding Plan 额度（看板「订阅额度」区块）
#   GET/PUT /api/dsh-usage/config                        统一配置（计价覆盖 + provider 映射 + 轮询间隔）
#   兼容别名（一个版本后移除）：/api/dsh-token-cost/*、/api/dsh-usage-board/*、/api/dsh-quota-visor/*
# Client half: 对话头部左徽标（实时费用）+ 右徽标（订阅额度）+ 设置页「用量看板」（含订阅额度区块）。
- insert:
    - id: dsh-usage
      name: '@hsinsekai-nanami/dsh-usage'
